<script>
    const apiKey = "AIzaSyBtAZkNIETI-SM6UtJs6RqJ85M-ZZyYqNk";
    const chatBox = document.getElementById('chatBox');
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const typingIndicator = document.getElementById('typingIndicator');
    const clearChatBtn = document.getElementById('clearChat');
    const helpModal = document.getElementById('helpModal');
    const themeModal = document.getElementById('themeModal');
    const welcomeScreen = document.getElementById('welcomeScreen');
    const chatApp = document.getElementById('chatApp');

    let chatHistory = [];

    const initialGreetings = [
        "ว่าไง... มีไรก็ว่ามา อย่าเวิ่นเว้อ 🙄",
        "มาอีกล่ะ... ไม่มีเพื่อนคุยเหรอ? 🙄",
        "ทักมาทำไม? อยากโดนขิงเหรอ? 🤪",
        "พร้อมล่ะ... พิมพ์มาสิ สั้นหรือยาวก็ตามอารมณ์ฉัน 🙄",
        "สวัสดีมนุษย์ขี้เหงา... มีไรให้กวนป่ะ? 🤪"
    ];

    // แก้ไข: ใส่เครื่องหมายคำพูด (Single Quotes) ครอบ String
    const systemPrompt = 'คุณคือ "NEO-BOT5000" เพื่อนเล่นที่กวนประสาท ประชดประชัน และขี้เล่นที่สุดในปฐพี กฎ: ใช้ภาษาไทยกวนๆ เป็นกันเองที่สุด ตอบคละความยาวตามความเหมาะสม ห้ามเป็นทางการ';

    function toggleHelp() { helpModal.classList.toggle('active'); }
    function toggleThemeModal() { themeModal.classList.toggle('active'); }

    function setTheme(theme) {
        document.body.className = '';
        if (theme !== 'default') document.body.classList.add('theme-' + theme);
        toggleThemeModal();
    }

    function startChat() {
        welcomeScreen.classList.add('hidden');
        chatApp.classList.remove('opacity-0');
        chatApp.classList.add('opacity-100');
        if (chatBox.children.length === 0) initializeBot();
    }

    function initializeBot() {
        const randomMsg = initialGreetings[Math.floor(Math.random() * initialGreetings.length)];
        appendMessage('bot', randomMsg);
    }

    async function speakText(element) {
        if (element.classList.contains('bubble-loading')) return;
        const textContent = element.querySelector('.text-content').textContent;
        element.classList.remove('bubble-error');
        element.classList.add('bubble-loading');

        try {
            // แก้ไข: ใช้ Backtick (`) สำหรับ Template String ที่มีตัวแปร
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: `Say in a sarcastic Thai tone: ${textContent}` }] }],
                generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } } } }
            };
            const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if (res.status === 429) throw new Error('QUOTA_EXCEEDED');
            if (!res.ok) throw new Error('TTS_FAILED');
            const result = await res.json();
            const audioData = result.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
            if (!audioData) throw new Error('NO_AUDIO_DATA');
            const audio = new Audio(URL.createObjectURL(pcmToWav(audioData, 24000)));
            audio.onended = () => { element.classList.remove('bubble-loading'); URL.revokeObjectURL(audio.src); };
            await audio.play();
        } catch (e) {
            element.classList.remove('bubble-loading');
            if (e.message === 'QUOTA_EXCEEDED') {
                element.classList.add('bubble-error');
                setTimeout(() => element.classList.remove('bubble-error'), 5000);
            }
        }
    }

    function pcmToWav(base64Data, sampleRate) {
        const binaryString = atob(base64Data);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
        const buffer = bytes.buffer;
        const wavHeader = new ArrayBuffer(44);
        const view = new DataView(wavHeader);
        view.setUint32(0, 0x52494646, false);
        view.setUint32(4, 36 + buffer.byteLength, true);
        view.setUint32(8, 0x57415645, false);
        view.setUint32(12, 0x666d7420, false);
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        view.setUint32(36, 0x64617461, false);
        view.setUint32(40, buffer.byteLength, true);
        return new Blob([wavHeader, buffer], { type: 'audio/wav' });
    }

    async function fetchAIResponse(message) {
        // แก้ไข: ใช้ Backtick (`)
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
        const contents = [{ role: "user", parts: [{ text: `System Instruction: ${systemPrompt}` }] }];
        
        chatHistory.forEach(msg => contents.push({ role: msg.role === 'user' ? 'user' : 'model', parts: [{ text: msg.text }] }));
        contents.push({ role: "user", parts: [{ text: message }] });
        try {
            const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents }) });
            if (res.status === 429) return "โควตาเต็มแล้วเพื่อน! พักหายใจแป๊บนึงค่อยพิมพ์ใหม่นะ";
            const data = await res.json();
            return data.candidates?.[0]?.content?.parts?.[0]?.text || "เงียบจัง... เน็ตกากเหรอ?";
        } catch (e) { return "สมองเบลอไปหมดล่ะ... ลองใหม่ดูดิ๊"; }
    }

    function appendMessage(role, text) {
        const wrapper = document.createElement('div');
        // แก้ไข: ใช้ Backtick และนำช่องว่างที่ผิดในคลาส Tailwind ออก
        wrapper.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'} animate-[fadeIn_0.5s_ease-out] w-full mb-4`;
        
        const bubble = document.createElement('div');
        bubble.className = `max-w-[88%] sm:max-w-[85%] message-bubble p-4 sm:p-5 rounded-2xl shadow-xl ${role === 'user' ? 'user-message rounded-tr-none' : 'bot-message rounded-tl-none'}`;
        
        bubble.onclick = function () { speakText(this); };
        
        const tag = document.createElement('p');
        tag.className = "text-[6px] header-font mb-1 opacity-50";
        tag.textContent = role === 'user' ? "USER_LOG" : "BOT_LOG";
        tag.style.color = role === 'user' ? 'var(--secondary)' : 'var(--primary)';
        bubble.appendChild(tag);
        
        const content = document.createElement('span');
        content.className = "leading-relaxed font-light text-content text-sm sm:text-base";
        content.textContent = text;
        bubble.appendChild(content);
        wrapper.appendChild(bubble);
        chatBox.appendChild(wrapper);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = userInput.value.trim();
        if (!msg) return;
        appendMessage('user', msg);
        userInput.value = '';
        typingIndicator.classList.remove('hidden');
        chatBox.scrollTop = chatBox.scrollHeight;
        const aiRes = await fetchAIResponse(msg);
        typingIndicator.classList.add('hidden');
        appendMessage('bot', aiRes);
        chatHistory.push({ role: 'user', text: msg }, { role: 'bot', text: aiRes });
        if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);
    });

    clearChatBtn.addEventListener('click', () => { chatBox.innerHTML = ''; chatHistory = []; initializeBot(); });

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            const blob = new Blob([`self.addEventListener('fetch', (e) => { });`], { type: 'text/javascript' });
            const url = URL.createObjectURL(blob);
            navigator.serviceWorker.register(url);
        });
    }
</script>
